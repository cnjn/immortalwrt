# The kernel sizes the conntrack table from RAM with a factor of 1, which gives
# only 3584 entries on this 445 MB board. With dae enabled the table filled up
# and the kernel dropped packets ("nf_conntrack: table full"). A transparent
# proxy also adds the router -> proxy node connection to every proxied flow.
# Entries are a few hundred bytes each, so 65536 cost roughly 20 MB at worst.
net.netfilter.nf_conntrack_max=65536
